[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-mw-lmc"
version = "0.3.0"
description = "Azimuth-resolved empirical orbit-superposition tools for the Milky Way halo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
astronomy = [
    "astropy>=6",
    "matplotlib>=3.8",
]
inference = [
    "scikit-optimize>=0.10",
    "scipy>=1.10",
]
dev = [
    "pytest>=8",
]
analysis = [
    "marimo>=0.23.15,<0.24",
    "matplotlib>=3.8",
]

[project.scripts]
halo-mw-lmc = "halo_mw_lmc.cli:main"
halo-mw-lmc-density = "halo_mw_lmc.generate_density:main"

[tool.setuptools.packages.find]
include = ["halo_mw_lmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
