# Stage-1 screening shard 07/12: fixed-point joint-objective screen.
# Design: scripts/generate_density_solved_r8_40_stage1_design.py
# (45 scrambled Sobol points, scipy seed 0, + 3 anchors; box qhalo [0.80,1.28],
#  phalo [0.70,0.96], rho0 [5.55,6.55], rho0_plus_2logrs [9.25,10.20],
#  gamma [0.70,1.45]). Parallel resource cap: 12 shards x OMP_NUM_THREADS=4.
schema_version = 1
recipe = "../recipes/zhu_2026_density_solved_r8_40_joint.toml"

[run]
id = "density-solved-r8-40-stage1-screen-shard07"
output_dir = "../../runs/density-solved-r8-40-stage1-screen-shard07"

[data]
catalog = "../../data_for_model/lamost_dr8_SFlast_cut4_4phi/halo_clean_N.txt"
target_density = "../../data_for_model/synthetic/desi_year1_kgiants_25x25x4.npz"

[optimizer]
iterations = 4
random_seed = 0
# Coordinate order: qhalo, phalo, rho0, rho0_plus_2logrs, gamma.
fixed_points = [
  [1.145, 0.700, 6.392, 10.161, 0.987],  # sobol_003,
  [1.163, 0.754, 6.249, 9.283, 1.077],  # sobol_015,
  [1.071, 0.738, 5.687, 9.541, 1.214],  # sobol_027,
  [1.264, 0.748, 6.305, 9.741, 0.812],  # sobol_039
]

[report]
velocity_bin_factor = 3

[coverage]
output_dir = "../../data_coverage-density-solved-r8-40-stage1-screen-shard07"
maximum_points = 20000
velocity_limit_km_s = 600.0
random_seed = 0
