# Stage-1 screening shard 02/12: fixed-point joint-objective screen.
# Design: scripts/generate_density_solved_r8_40_stage1_design.py
# (45 scrambled Sobol points, scipy seed 0, + 3 anchors; box qhalo [0.80,1.28],
#  phalo [0.70,0.96], rho0 [5.55,6.55], rho0_plus_2logrs [9.25,10.20],
#  gamma [0.70,1.45]). Parallel resource cap: 12 shards x OMP_NUM_THREADS=4.
schema_version = 1
recipe = "../recipes/zhu_2026_density_solved_r8_40_joint_screen.toml"

[run]
id = "density-solved-r8-40-stage1-screen-shard02"
output_dir = "../../runs/density-solved-r8-40-stage1-screen-shard02"

[data]
catalog = "../../data_for_model/lamost_dr8_SFlast_cut4_4phi/halo_clean_N.txt"
target_density = "../../data_for_model/synthetic/desi_year1_kgiants_25x25x4.npz"

[optimizer]
iterations = 4
random_seed = 0
# Coordinate order: qhalo, phalo, rho0, rho0_plus_2logrs, gamma.
fixed_points = [
  [0.920, 0.800, 5.900, 10.050, 0.800],  # more_extended,
  [0.954, 0.946, 6.136, 9.674, 1.064],  # sobol_010,
  [0.905, 0.886, 6.278, 9.549, 1.322],  # sobol_022,
  [0.988, 0.938, 6.447, 10.195, 1.341],  # sobol_034
]

[report]
velocity_bin_factor = 3

[coverage]
output_dir = "../../data_coverage-density-solved-r8-40-stage1-screen-shard02"
maximum_points = 20000
velocity_limit_km_s = 600.0
random_seed = 0
