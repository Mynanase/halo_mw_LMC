# 实验性 No-Fixed recipe 的 n_z 极端减稀变体（docs/nphi1_bundling_repair_plan.md §8 后续）：
# 与 zhu_2026_density_solved.toml 唯一区别是 n_z 25 -> 7。
# 与 nz13 变体一起给出约束数递减的趋势点；速度评分网格与密度网格无关，保持不变。
schema_version = 1
name = "zhu_2026_density_solved_4phi_nz7"

[potential]
recipe = "zhu_2026_fiducial_constant_shape"

[density_grid]
n_r = 25
r_range_kpc = [0.0, 50.0]
n_z = 7
z_range_kpc = [0.0, 50.0]
n_phi = 4
phi_origin_deg = -180.0

[density_fit]
min_abs_z_kpc = 2.0
min_radius_kpc = 15.0
max_radius_kpc = 40.0
normalization_min_radius_kpc = 10.0
require_positive_target = true
# 权重本身决定密度振幅，禁止再拟合自由全局 scale。
normalization = "none"

[velocity_fit]
enabled = true
min_radius_kpc = 8.0
probability_floor = 1e-300
radius_edges_kpc = [4.0, 6.0, 8.0, 10.0, 12.0, 15.0, 20.0, 30.0, 50.0]
theta_edges_deg = [0.0, 15.0, 30.0, 45.0, 60.0, 90.0]
velocity_range_km_s = [-800.0, 800.0]
velocity_bins = 201

[weight_model]
mode = "density_solved"
solver = "lsq_linear"
target_normalization = "unit_mass"
regularization = "l2"
regularization_strength = 1e-6
max_iter = 20000
lsmr_tol = 1e-6

[objective]
mode = "velocity_only"
density_max_chi2_per_bin = 2.0

[orbits]
periods = 10.0
samples_per_orbit = 1000

[search]
initial_point = "paper_best"
round_decimals = 3

[search.bounds]
qhalo = [0.70, 1.15]
phalo = [0.40, 1.20]
rho0 = [5.50, 7.00]
rho0_plus_2logrs = [9.50, 10.30]
gamma = [0.50, 1.80]
