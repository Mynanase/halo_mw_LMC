# 将 DESI year-1 K-giant 相对密度模型体积平均到 n_z=7 极端减稀网格。
# 与 desi_year1_kgiants.toml 唯一区别：recipe 指向 nz7 变体、输出路径不同。
schema_version = 1
recipe = "../recipes/zhu_2026_density_solved_nz7.toml"

[model]
name = "desi_year1_kgiants_3d"
# 仅用于 provenance/hash；生成器不导入这个带有 4000 万样本副作用的脚本。
source = "../../Desi/3D_density_profile.py"

[quadrature]
# validation_order 的结果作为 target；两阶差值计入数值误差。
order = 4
validation_order = 6

[uncertainty]
# 这是显式的 synthetic model discrepancy，不是 DESI 后验测量误差。
fractional = 0.10

[output]
path = "../../data_for_model/synthetic/desi_year1_kgiants_25x7x4.npz"
