output_dir = ".agent-local/benchmarks/nphi4_oracle_1024"

grouping_mode = "response_kmeans"
kmeans_bundles = 1024
kmeans_seed = 0
random_seed = 0
repeat_runs = 1
reduced_kkt_tolerance = 1e-8
