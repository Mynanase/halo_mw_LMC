grouping_mode = "response_kmeans_minibatch"
kmeans_bundles = 2304
kmeans_seed = 0
minibatch_size = 1024
minibatch_rounds = 100
random_seed = 0
repeat_runs = 1
reduced_kkt_tolerance = 1e-8
