# nphi4 production-grid bundling baseline (docs/nphi1_bundling_repair_plan.md §8):
# the stage-2-style full/bundled/random comparison redone on the explicit
# (R, z, phi) 25x25x4 grid and per-sector conditional velocity scoring.
# Same frozen library, solver, scoring boundary and audited (lam_z, energy)
# partition as nphi1_bundling.toml; only the grid/target/run config change.
# No nphi1 historical reference is carried over (cross-grid citations are
# reference-only noise here).
# Plain toml read by scripts/benchmark_nphi1_bundling.py via tomllib; not a run schema.
# Paths are resolved relative to the repository root.

run_config = "configs/runs/density_solved_benchmark.toml"
frozen_cache = ".agent-local/benchmarks/solver_settings_sweep/frozen_paper_best.npz"
frozen_provenance = ".agent-local/benchmarks/solver_settings_sweep/freeze.json"
output_dir = ".agent-local/benchmarks/nphi4_repair"

grouping_variables = ["lam_z", "energy"]
n_lambda = 32
n_energy = 32
random_seed = 0
repeat_runs = 1
reduced_kkt_tolerance = 1e-8
